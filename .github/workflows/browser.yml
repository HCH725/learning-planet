name: Browser (non-blocking)

# Intentionally NOT part of required checks: a red browser job is evidence,
# not a merge blocker. `baseline` remains the only required status check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Show browser report
        if: always()
        run: cat evidence/browser/report.json || true
